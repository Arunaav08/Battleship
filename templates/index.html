<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Battleship — Naval Command Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="ocean" aria-hidden="true">
  <div class="ocean__swell ocean__swell--1"></div>
  <div class="ocean__swell ocean__swell--2"></div>
  <div class="ocean__grid"></div>
  <div class="ocean__vignette"></div>
</div>

<main class="lobby">
  <div class="lobby__hero">
    <div class="ship-container">
      <svg class="battleship" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M20,50 L40,35 L160,35 L180,50 L170,65 L30,65 Z" fill="#2a4a5f" stroke="#4fe3c1" stroke-width="2"/>
        <rect x="50" y="30" width="100" height="8" fill="#1a3a4f" stroke="#4fe3c1" stroke-width="1"/>
        <rect x="75" y="18" width="50" height="15" fill="#1a3a4f" stroke="#4fe3c1" stroke-width="1.5"/>
        <line x1="100" y1="18" x2="100" y2="8" stroke="#4fe3c1" stroke-width="1.5"/>
        <circle cx="100" cy="6" r="2" fill="#4fe3c1"/>
        <circle cx="85" cy="24" r="2" fill="#4fe3c1"/>
        <circle cx="100" cy="24" r="2" fill="#4fe3c1"/>
        <circle cx="115" cy="24" r="2" fill="#4fe3c1"/>
        <rect x="55" y="32" width="8" height="3" fill="#4fe3c1"/>
        <rect x="137" y="32" width="8" height="3" fill="#4fe3c1"/>
      </svg>
      <div class="ship-waves">
        <svg class="wave wave--1" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,60 C150,90 350,30 600,60 C850,90 1050,30 1200,60 L1200,120 L0,120 Z" fill="rgba(79,227,193,0.15)"/></svg>
        <svg class="wave wave--2" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,80 C200,50 400,100 600,80 C800,60 1000,100 1200,80 L1200,120 L0,120 Z" fill="rgba(79,227,193,0.1)"/></svg>
      </div>
    </div>
    <h1 class="lobby__title">BATTLE<span>SHIP</span></h1>
    <p class="lobby__subtitle">TACTICAL COMMAND // SECTOR 7-G</p>
  </div>

  <div class="lobby__controls" id="lobbyControls">
    <div class="lobby__input-group">
      <label for="username" class="lobby__label">CALLSIGN</label>
      <input type="text" id="username" class="lobby__input" placeholder="Enter your name" maxlength="20" value="Commander">
    </div>
    <button id="joinBtn" class="btn btn--primary btn--large">
      <span class="btn__text">JOIN QUEUE</span>
    </button>
  </div>

  <div class="lobby__waiting" id="waitingState" hidden>
    <div class="waiting__indicator">
      <span class="waiting__dot"></span>
      <span class="waiting__dot"></span>
      <span class="waiting__dot"></span>
    </div>
    <p class="waiting__text">SEARCHING FOR OPPONENT...</p>
    <button id="cancelBtn" class="btn">CANCEL</button>
  </div>
</main>

<div class="notification" id="notification" hidden>
  <span class="notification__text" id="notificationText"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
(() => {
  const socket = io();
  const joinBtn = document.getElementById('joinBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const usernameInput = document.getElementById('username');
  const lobbyControls = document.getElementById('lobbyControls');
  const waitingState = document.getElementById('waitingState');
  const notification = document.getElementById('notification');
  const notificationText = document.getElementById('notificationText');

  function showNotification(text, duration = 3000) {
    notificationText.textContent = text;
    notification.hidden = false;
    notification.classList.add('notification--show');
    setTimeout(() => {
      notification.classList.remove('notification--show');
      setTimeout(() => notification.hidden = true, 500);
    }, duration);
  }

  joinBtn.addEventListener('click', () => {
    const username = usernameInput.value.trim() || 'Commander';
    socket.emit('join_queue', { username });
    lobbyControls.hidden = true;
    waitingState.hidden = false;
  });

  cancelBtn.addEventListener('click', () => {
    socket.emit('leave_queue');
    waitingState.hidden = true;
    lobbyControls.hidden = false;
  });

  socket.on('match_found', (data) => {
    showNotification('MATCH FOUND! DEPLOYING...');
    setTimeout(() => {
      window.location.href = `/game?token=${data.token}`;
    }, 1500);
  });
})();
</script>
</body>
</html>
